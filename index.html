<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жұлдызды ұста!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #10152f, #283b75);
            padding: 20px;
        }

        .game {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 36px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stats div {
            background: #ffffff20;
            padding: 12px 18px;
            border-radius: 12px;
        }

        #arena {
            position: relative;
            height: 350px;
            overflow: hidden;
            border: 2px solid white;
            border-radius: 20px;
            background: linear-gradient(160deg, #172653, #28174c);
        }

        #star {
            position: absolute;
            display: none;
            width: 55px;
            height: 55px;
            border: none;
            border-radius: 50%;
            background: #ffe66d;
            font-size: 30px;
            cursor: pointer;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px #ffe66d;
        }

        #message {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        button.control {
            margin: 15px 5px 0;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #8af0d2;
            color: #12243a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button.control:hover {
            background: #65dfbd;
        }

        .hint {
            color: #c8d2ff;
        }
    </style>
</head>

<body>

<div class="game">

    <h1>🌟 Жұлдызды ұста!</h1>

    <p>30 секунд ішінде мүмкіндігінше көп жұлдыз жина!</p>

    <div class="stats">
        <div>Ұпай: <strong id="score">0</strong></div>
        <div>Уақыт: <strong id="time">30</strong> сек</div>
        <div>Рекорд: <strong id="best">0</strong></div>
    </div>

    <div id="arena">

        <button id="star">⭐</button>

        <div id="message">
            <h2 id="messageTitle">Дайынсың ба?</h2>
            <p id="messageText">
                Ойынды баста да, пайда болған жұлдызды ұста!
            </p>
        </div>

    </div>

    <button class="control" id="start">Ойынды бастау</button>
    <button class="control" id="reset">Қайта бастау</button>

    <p class="hint">Жұлдызды бассаң, +1 ұпай аласың!</p>

</div>

<script>
    const arena = document.getElementById("arena");
    const star = document.getElementById("star");

    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const bestEl = document.getElementById("best");

    const message = document.getElementById("message");
    const messageTitle = document.getElementById("messageTitle");
    const messageText = document.getElementById("messageText");

    const startBtn = document.getElementById("start");
    const resetBtn = document.getElementById("reset");

    let score = 0;
    let timeLeft = 30;
    let timer = null;
    let playing = false;

    let best = Number(localStorage.getItem("starCatchBest") || 0);
    bestEl.textContent = best;

    // Жұлдызды кездейсоқ орынға орналастыру
    function moveStar() {
        const padding = 35;

        const x = padding + Math.random() *
            (arena.clientWidth - padding * 2);

        const y = padding + Math.random() *
            (arena.clientHeight - padding * 2);

        star.style.left = x + "px";
        star.style.top = y + "px";
    }

    // Ойынды бастау
    function startGame() {
        clearInterval(timer);

        score = 0;
        timeLeft = 30;
        playing = true;

        scoreEl.textContent = score;
        timeEl.textContent = timeLeft;

        message.style.display = "none";
        star.style.display = "block";

        startBtn.textContent = "Ойын жүріп жатыр...";

        moveStar();

        timer = setInterval(function () {
            timeLeft--;
            timeEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    // Жұлдызды ұстау
    star.addEventListener("click", function () {
        if (!playing) return;

        score++;
        scoreEl.textContent = score;

        // Рекордты жаңарту
        if (score > best) {
            best = score;
            bestEl.textContent = best;

            localStorage.setItem(
                "starCatchBest",
                String(best)
            );
        }

        moveStar();
    });

    // Ойынды аяқтау
    function endGame() {
        playing = false;
        clearInterval(timer);

        star.style.display = "none";
        message.style.display = "flex";

        messageTitle.textContent = "Ойын аяқталды! 🎉";

        messageText.textContent =
            "Сен " + score +
            " ұпай жинадың! Қайта ойнап көр!";

        startBtn.textContent = "Қайта ойнау";
    }

    // Бастау батырмасы
    startBtn.addEventListener("click", function () {
        if (!playing) {
            startGame();
        }
    });

    // Қайта бастау батырмасы
    resetBtn.addEventListener("click", function () {
        clearInterval(timer);

        playing = false;
        score = 0;
        timeLeft = 30;

        scoreEl.textContent = 0;
        timeEl.textContent = 30;

        star.style.display = "none";
        message.style.display = "flex";

        messageTitle.textContent = "Дайынсың ба?";

        messageText.textContent =
            "Ойынды баста да, пайда болған жұлдызды ұста!";

        startBtn.textContent = "Ойынды бастау";
    });
</script>

</body>
</html>
